<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 95" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .brand-accent {
        font-family: 'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #00d2ff;
      }
    </style>

    <!-- Gradiente metálico oscuro para hexágono 1 -->
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente metálico plateado para hexágono 2 -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradiente cian neón para hexágono 3 -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filtros de resplandor neón -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- GRUPO DE 3 HEXÁGONOS INTERCONECTADOS -->
  <g transform="translate(10, 5)">
    <!-- Hexágono 1 (Inferior Izquierdo) -->
    <polygon points="40,24 64,38 64,66 40,80 16,66 16,38" 
             fill="none" stroke="#00f2fe" stroke-width="7" opacity="0.3" filter="url(#neonGlow)"/>
    <polygon points="40,24 64,38 64,66 40,80 16,66 16,38" 
             fill="none" stroke="url(#metalDark)" stroke-width="6.5" stroke-linejoin="round"/>
    <polygon points="40,30 58,40 58,64 40,74 22,64 22,40" 
             fill="#070d1e" stroke="#334155" stroke-width="1.5"/>

    <!-- Hexágono 2 (Central Intermedio) -->
    <polygon points="76,14 100,28 100,56 76,70 52,56 52,28" 
             fill="none" stroke="#00b4d8" stroke-width="6.5" opacity="0.25"/>
    <polygon points="76,14 100,28 100,56 76,70 52,56 52,28" 
             fill="none" stroke="url(#metalSilver)" stroke-width="6.5" stroke-linejoin="round"/>
    <polygon points="76,20 94,30 94,54 76,64 58,54 58,30" 
             fill="#081126" stroke="#64748b" stroke-width="1.5"/>

    <!-- Hexágono 3 (Superior Derecho - Neón Radiante) -->
    <polygon points="112,4 136,18 136,46 112,60 88,46 88,18" 
             fill="none" stroke="#00f2fe" stroke-width="9" opacity="0.6" filter="url(#neonGlow)"/>
    <polygon points="112,4 136,18 136,46 112,60 88,46 88,18" 
             fill="none" stroke="url(#cyanGlowGrad)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="112,10 130,20 130,44 112,54 94,44 94,20" 
             fill="#061633" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="112,16 124,23 124,41 112,48 100,41 100,23" 
             fill="#00f2fe" opacity="0.3"/>
  </g>

  <!-- TEXTO CATALYST IDEAS CON SEPARACIÓN ELEGANTE Y PROFESIONAL -->
  <g transform="translate(182, 58)">
    <text x="0" y="0" class="brand-title">CATALYST</text>
    <!-- Separación limpia de 28px entre la T y la I para evitar solapamientos -->
    <text x="214" y="0" class="brand-accent" filter="url(#textGlow)">IDEAS</text>
  </g>
</svg>
