<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 90" width="100%" height="100%">
  <defs>
    <linearGradient id="iconMetalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="iconMetalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="iconCyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="iconNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Hexágono 1 -->
    <polygon points="40,24 64,38 64,66 40,80 16,66 16,38" 
             fill="none" stroke="#00f2fe" stroke-width="7" opacity="0.3" filter="url(#iconNeonGlow)"/>
    <polygon points="40,24 64,38 64,66 40,80 16,66 16,38" 
             fill="none" stroke="url(#iconMetalDark)" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="40,30 58,40 58,64 40,74 22,64 22,40" 
             fill="#070d1e" stroke="#334155" stroke-width="1.5"/>

    <!-- Hexágono 2 -->
    <polygon points="76,14 100,28 100,56 76,70 52,56 52,28" 
             fill="none" stroke="url(#iconMetalSilver)" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="76,20 94,30 94,54 76,64 58,54 58,30" 
             fill="#081126" stroke="#64748b" stroke-width="1.5"/>

    <!-- Hexágono 3 -->
    <polygon points="112,4 136,18 136,46 112,60 88,46 88,18" 
             fill="none" stroke="#00f2fe" stroke-width="9" opacity="0.6" filter="url(#iconNeonGlow)"/>
    <polygon points="112,4 136,18 136,46 112,60 88,46 88,18" 
             fill="none" stroke="url(#iconCyanGlowGrad)" stroke-width="6.5" stroke-linejoin="round"/>
    <polygon points="112,10 130,20 130,44 112,54 94,44 94,20" 
             fill="#061633" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="112,16 124,23 124,41 112,48 100,41 100,23" 
             fill="#00f2fe" opacity="0.3"/>
  </g>
</svg>
